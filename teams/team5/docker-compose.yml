# Team team5 — deployment.

services:
  gateway:
    image: nginx:alpine
    ports:
      - "9105:80"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf
      - ./staticfiles:/app/staticfiles:ro
      - ./media:/app/media:ro
    depends_on:
      - backend
    networks:
      - polylife
      - team

  backend:
    build: .
    env_file:
      - .env
    depends_on:
      - db
    networks:
      team:
      polylife:
        aliases: [team5-backend]   # reached by the shared gateway (deploy/)
    volumes:
      - ./staticfiles:/app/teams/team5/staticfiles
      - ./media:/app/teams/team5/media

  db:
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - team

volumes:
  postgres-data:

networks:
  polylife:
    external: true
    name: polylife_net

  team:
