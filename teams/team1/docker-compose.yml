# Team team1 — deployment.
#
# No passwords/keys live in this file. All config comes from `.env`
# (the run script copies `.env.example` -> `.env` for you the first time).
#
# The gateway, a backend (this app mounted on the core project, like team 6)
# and its database run out of the box. Start with:   ./run.ps1   (Windows)   or   ./run.sh
services:
  gateway:
    image: nginx:alpine
    ports:
      - "${TEAM_PORT}:80"               # your team's unique port (from .env)
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - CORE_BASE_URL=${CORE_BASE_URL}  # from .env
    networks: [polylife]
    depends_on: [backend]

  # --- Your service ---------------------------------------------------------
  # Runs `teams.team1` inside the core's Django project (TEAM_APPS), so its
  # routes are the ones in urls.py. Swap Dockerfile.backend for your own stack
  # whenever you need to; keep the network alias below.
  backend:
    build:
      context: ../..
      dockerfile: teams/team1/Dockerfile.backend
    env_file: .env                    # DATABASE_URL & secret key come from .env
    environment:
      TEAM_APPS: teams.team1
      DJANGO_ALLOWED_HOSTS: "backend,team1-backend,localhost,127.0.0.1"
    command: >
      sh -c "python manage.py migrate --noinput &&
      gunicorn polylife.wsgi:application --bind 0.0.0.0:8000"
    expose: ["8000"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      team:
      polylife:
        aliases: [team1-backend]   # REQUIRED: the shared gateway (deploy/) reaches you by this name

  db:
    image: postgres:16-alpine
    env_file: .env                    # POSTGRES_DB/USER/PASSWORD from .env
    volumes: [db-data:/var/lib/postgresql/data]
    networks: [team]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:

networks:
  polylife:                             # shared with the core (gateway <-> core)
    external: true
    name: polylife_net
  team:                                 # private app <-> db
