# Forward-auth: ask the core who the caller is, then hand the verified identity
# to the team service. Any X-User-* sent by the client is overwritten here.
auth_request /_auth;
auth_request_set $auth_user_id   $upstream_http_x_user_id;
auth_request_set $auth_user_name $upstream_http_x_user_username;
proxy_set_header X-User-Id       $auth_user_id;
proxy_set_header X-User-Username $auth_user_name;
